name: CI

on:
  push:
    branches: [main, DEV]
  pull_request:
    branches: [main, DEV]

permissions:
  contents: read

env:
  BASEFWX_REPO: "https://github.com/F1xGOD/basefwx.git"
  BASEFWX_REF_FILE: "config/refs/basefwx.ref"
  YUME_VENDOR_ARCHIVE: "third_party/prebuilt/yume-vendor-prebuilt.tar.xz"

jobs:
  website-build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync docs into website
        run: |
          set -euo pipefail
          mkdir -p website/docs
          for src in docs/*.md; do
            [[ -f "$src" ]] || continue
            name="$(basename "$src")"
            dst="website/docs/$name"
            title="$(head -n1 "$src" | sed 's/^#\s*//')"
            permalink="/docs/$(basename "$name" .md)/"
            {
              echo "---"
              echo "layout: doc"
              echo "title: $title"
              echo "permalink: $permalink"
              echo "---"
              echo
              cat "$src"
            } > "$dst"
          done

      - name: Build website
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./website
          destination: ./_site

  preflight:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate pinned BaseFWX ref and crypto guards
        run: |
          python3 ./scripts/release_preflight.py

  build-and-smoke:
    needs: [preflight]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure BaseFWX sources
        run: |
          BASEFWX_REF="${BASEFWX_REF:-}"
          if [[ -z "${BASEFWX_REF}" && -f "${BASEFWX_REF_FILE}" ]]; then
            BASEFWX_REF="$(tr -d '[:space:]' < "${BASEFWX_REF_FILE}")"
          fi
          if [[ -z "${BASEFWX_REF}" ]]; then
            BASEFWX_REF="main"
          fi
          if [[ -d basefwx ]] && ! git -C basefwx rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            rm -rf basefwx
          fi
          if ! git -C basefwx rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            rm -rf basefwx
            git clone --filter=blob:none --no-checkout "${BASEFWX_REPO}" basefwx
          fi
          git -C basefwx fetch --depth 1 origin "${BASEFWX_REF}"
          git -C basefwx checkout --detach FETCH_HEAD
          test -f basefwx/cpp/CMakeLists.txt
          echo "Using BaseFWX ref: $(git -C basefwx rev-parse HEAD)"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libssl-dev zlib1g-dev liblzma-dev libzstd-dev libargon2-dev \
            libboost-all-dev libspdlog-dev nlohmann-json3-dev

      - name: Extract prebuilt vendor libs
        run: |
          if [[ -f "${YUME_VENDOR_ARCHIVE}" ]]; then
            tar -xJf "${YUME_VENDOR_ARCHIVE}"
          fi
          test -d vendor/linux-x86_64
          cmake -S . -B build-ci \
            -DCMAKE_BUILD_TYPE=Release \
            -DBASEFWX_USE_VENDOR_DEPS=ON \
            -DBASEFWX_VENDOR_DIR="${GITHUB_WORKSPACE}/vendor/linux-x86_64" \
            -DBASEFWX_REQUIRE_ARGON2=ON \
            -DBASEFWX_REQUIRE_OQS=ON \
            -DBASEFWX_REQUIRE_LZMA=ON

      - name: Build
        run: |
          cmake --build build-ci --parallel

      - name: Smoke test binaries
        run: |
          ./build-ci/bin/yume --help >/dev/null
          ./build-ci/bin/yumed --help >/dev/null

      - name: Inspect binaries
        run: |
          set -euo pipefail
          file ./build-ci/bin/yume ./build-ci/bin/yumed
          ldd ./build-ci/bin/yume
          ldd ./build-ci/bin/yumed
