name: CodeQL

on:
  push:
    branches: [main, DEV]
  pull_request:
    branches: [main, DEV]
  schedule:
    - cron: "17 9 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

env:
  CODEQL_BUILD_JOBS: "2"
  YUME_OPENSSL_FORCE_PINNED: "1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: manual
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Ensure BaseFWX sources
        if: matrix.language == 'c-cpp'
        run: |
          set -euo pipefail
          BASEFWX_REPO="$(python3 scripts/yume_dependencies.py get basefwx repository)"
          BASEFWX_REF="$(python3 scripts/yume_dependencies.py get basefwx revision)"
          rm -rf basefwx
          git clone --filter=blob:none --no-checkout "${BASEFWX_REPO}" basefwx
          git -C basefwx fetch --depth 1 origin "${BASEFWX_REF}"
          git -C basefwx checkout --detach FETCH_HEAD
          test -f basefwx/cpp/CMakeLists.txt
          echo "Using BaseFWX ref: $(git -C basefwx rev-parse HEAD)"

      - name: Install C++ dependencies
        if: matrix.language == 'c-cpp'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config perl \
            zlib1g-dev liblzma-dev libzstd-dev libargon2-dev libnghttp2-dev \
            libboost-all-dev libspdlog-dev nlohmann-json3-dev
          bash scripts/ensure-openssl.sh
          bash scripts/ensure-nghttp2.sh

      # See ci.yml: the archive is not committed any more, so this fetches it
      # from the published mirror and verifies it against the pinned SHA-256
      # and release-key fingerprint before unpacking.
      - name: Fetch and verify prebuilt vendor libs
        if: matrix.language == 'c-cpp'
        run: |
          bash scripts/vendor_prebuilt.sh ensure linux-x86_64

      - name: Configure C++ CodeQL build
        if: matrix.language == 'c-cpp'
        run: |
          test "$(pkg-config --modversion openssl)" = "3.5.7"
          openssl list -signature-algorithms | grep -F 'ML-DSA-87'
          cmake -S . -B build-codeql \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DYUME_LTO=OFF \
            -DBASEFWX_USE_VENDOR_DEPS=ON \
            -DBASEFWX_VENDOR_DIR="${GITHUB_WORKSPACE}/vendor/linux-x86_64" \
            -DBASEFWX_REQUIRE_ARGON2=ON \
            -DBASEFWX_REQUIRE_OQS=ON \
            -DBASEFWX_REQUIRE_LZMA=ON

      - name: Build C++ production targets
        if: matrix.language == 'c-cpp'
        run: |
          cmake --build build-codeql \
            --target yume yumed yume_facade \
            --parallel "${CODEQL_BUILD_JOBS}"

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
