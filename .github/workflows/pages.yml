name: Deploy website to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - "docs/**"
      - "CONTRIBUTING.md"
      - "scripts/sync_website_docs.sh"
      - "scripts/yume_docs.py"
      - "scripts/yume_doc_inline.py"
      - "scripts/yume_doc_man.py"
      - "scripts/yume_doc_markdown.py"
      - "scripts/yume_doc_spec.py"
      - "scripts/yume_doc_web.py"
      - "scripts/yume_diagram_theme.py"
      - "scripts/yume_cli.py"
      - "scripts/yume_diagrams.py"
      - "scripts/yume_diagram_ascii.py"
      - "scripts/yume_diagram_preview.py"
      - "scripts/yume_diagram_spec.py"
      - "scripts/yume_diagram_svg.py"
      - "scripts/check_website_catalog.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the generated documents
        run: python3 scripts/yume_docs.py check --all-languages

      - name: Sync docs into website
        run: bash scripts/sync_website_docs.sh

      - name: Check the generated diagrams
        run: python3 scripts/yume_diagrams.py check

      - name: Validate website catalog
        run: |
          python3 scripts/check_website_catalog.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./website
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
