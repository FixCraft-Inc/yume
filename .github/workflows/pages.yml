name: Deploy website to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - "docs/**"
      - "CONTRIBUTING.md"
      - "scripts/sync_website_docs.sh"
      - "scripts/yume_docs.py"
      - "scripts/yume_doc_inline.py"
      - "scripts/yume_doc_man.py"
      - "scripts/yume_doc_markdown.py"
      - "scripts/yume_doc_spec.py"
      - "scripts/yume_doc_web.py"
      - "scripts/yume_diagram_theme.py"
      - "scripts/yume_cli.py"
      - "scripts/yume_diagrams.py"
      - "scripts/yume_diagram_ascii.py"
      - "scripts/yume_diagram_preview.py"
      - "scripts/yume_diagram_spec.py"
      - "scripts/yume_diagram_svg.py"
      - "scripts/check_website_catalog.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check the generated documents
        run: python3 scripts/yume_docs.py check --all-languages

      - name: Sync docs into website
        run: bash scripts/sync_website_docs.sh

      - name: Check the generated diagrams
        run: python3 scripts/yume_diagrams.py check

      - name: Validate website catalog
        run: |
          python3 scripts/check_website_catalog.py

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Build site
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./website
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5