name: Deploy website to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync docs into website
        run: |
          set -euo pipefail
          mkdir -p website/docs
          rm -f website/docs/*.md
          for src in docs/*.md; do
            [[ -f "$src" ]] || continue
            name="$(basename "$src")"
            dst="website/docs/$name"
            title="$(head -n1 "$src" | sed 's/^#\s*//')"
            permalink="/docs/$(basename "$name" .md)/"
            {
              echo "---"
              echo "layout: doc"
              echo "title: $title"
              echo "permalink: $permalink"
              echo "---"
              echo
              # Sibling doc links are written for GitHub (FOO.md). On the site
              # each doc lives at /docs/FOO/, so rewrite them or they 404.
              sed -E 's@\]\(([A-Z0-9_]+)\.md(#[^)]*)?\)@](/docs/\1/\2)@g' "$src"
            } > "$dst"
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./website
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
