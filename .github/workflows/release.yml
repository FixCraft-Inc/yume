name: Release

on:
  workflow_dispatch:
    inputs:
      release_profile:
        description: "Release profile"
        required: true
        default: "linux-desktop-0.2.0"
        type: choice
        options:
          - linux-desktop-0.2.0
      tag_name:
        description: "Existing release tag (v0.2.0-rcN or v0.2.0)"
        required: true
        type: string
      publish:
        description: "Attach validated artifacts to the existing GitHub release"
        required: true
        default: false
        type: boolean
      independent_security_review:
        description: "Independent security review is complete"
        required: true
        default: false
        type: boolean
      rc_gates_approved:
        description: "Documented lifecycle, scale, soak, WAN, and same-session gates passed"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: yume-release-${{ inputs.tag_name }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.26.5"
  YUME_OPENSSL_FORCE_PINNED: "1"

jobs:
  preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release source and approvals
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "workflow_dispatch releases must be started from main." >&2
            exit 1
          fi
          if [[ "${{ inputs.release_profile }}" != "linux-desktop-0.2.0" ]]; then
            echo "Unsupported release profile." >&2
            exit 1
          fi
          if [[ "${{ inputs.publish }}" == "true" ]]; then
            if [[ "${{ inputs.independent_security_review }}" != "true" || \
                  "${{ inputs.rc_gates_approved }}" != "true" ]]; then
              echo "Publishing requires independent review and every documented RC gate." >&2
              exit 1
            fi
          fi
          python3 scripts/release_preflight.py \
            --profile "${{ inputs.release_profile }}" \
            --tag "${{ inputs.tag_name }}"

  build-linux:
    needs: [preflight]
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up exact Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          check-latest: false
          cache-dependency-path: helper/chrome_tls/go.sum

      - name: Verify host lane
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          ldd --version 2>&1 | head -1 | grep -Eq 'GNU libc|GLIBC'
          test "$(go env GOVERSION)" = "go${GO_VERSION}"

      - name: Ensure exact BaseFWX source
        shell: bash
        run: |
          set -euo pipefail
          BASEFWX_REPO="$(python3 scripts/yume_dependencies.py get basefwx repository)"
          BASEFWX_REF="$(python3 scripts/yume_dependencies.py get basefwx revision)"
          if ! git -C basefwx rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            rm -rf basefwx
            git clone --filter=blob:none --no-checkout "${BASEFWX_REPO}" basefwx
          fi
          git -C basefwx fetch --depth 1 origin "${BASEFWX_REF}"
          git -C basefwx checkout --detach FETCH_HEAD
          test "$(git -C basefwx rev-parse HEAD)" = "${BASEFWX_REF}"

      - name: Install Linux x86-64 build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config binutils xz-utils perl \
            zlib1g-dev libbrotli-dev liblzma-dev libzstd-dev libargon2-dev \
            libnghttp2-dev libboost-all-dev libspdlog-dev nlohmann-json3-dev
          source scripts/ensure-openssl.sh
          yume_openssl_ensure
          source scripts/ensure-nghttp2.sh
          yume_nghttp2_ensure
          YUME_LIBOQS_PREFIX="${RUNNER_TEMP}/liboqs-host-prefix"
          LIBOQS_TARGET=host \
            LIBOQS_VERSION=0.16.0 \
            LIBOQS_BUILD_DIR="${RUNNER_TEMP}/liboqs-host" \
            LIBOQS_PREFIX_OVERRIDE="${YUME_LIBOQS_PREFIX}" \
            bash scripts/build-liboqs-target.sh
          printf 'YUME_LIBOQS_PREFIX=%s\n' "${YUME_LIBOQS_PREFIX}" >> "${GITHUB_ENV}"

      - name: Prime pinned modules, then test offline
        working-directory: helper/chrome_tls
        shell: bash
        run: |
          set -euo pipefail
          GOTOOLCHAIN=local go mod download
          GOTOOLCHAIN=local GOPROXY=off go test -mod=readonly -count=1 ./...
          GOTOOLCHAIN=local GOPROXY=off go test -mod=readonly -count=1 -race ./...

      - name: Configure first clean Linux build
        shell: bash
        run: |
          set -euo pipefail
          test "$(pkg-config --modversion openssl)" = "3.5.7"
          openssl list -signature-algorithms | grep -F 'ML-DSA-87'
          cmake -S . -B build-helper-a -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DYUME_USE_BASEFWX=ON \
            -DYUME_BUILD_CHROME_TLS_HELPER=ON \
            -DYUME_GO_EXECUTABLE="$(command -v go)" \
            -DYUME_BUILD_GUI=OFF \
            -DYUME_BUILD_TOOLS=OFF \
            -DYUME_BUILD_SHARED_ABI=OFF \
            -DYUME_BUILD_SELFTEST=OFF \
            -DYUME_BUILD_TESTING=ON \
            -DYUME_STATIC=OFF \
            -DYUME_STATIC_OPENSSL=ON \
            -DYUME_NATIVE_OPT=OFF \
            -DYUME_FAST_MATH=OFF \
            -DYUME_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_SKIP_BUILD_RPATH=ON \
            -DBASEFWX_REQUIRE_ARGON2=ON \
            -DBASEFWX_REQUIRE_OQS=ON \
            -DBASEFWX_OQS_STATIC=ON \
            -DOQS_INCLUDE_DIR="${YUME_LIBOQS_PREFIX}/include" \
            -DOQS_LIBRARY="${YUME_LIBOQS_PREFIX}/lib/liboqs.a" \
            -DOQS_LIBRARY_STATIC="${YUME_LIBOQS_PREFIX}/lib/liboqs.a" \
            -DBASEFWX_REQUIRE_LZMA=ON

      - name: Build and test first clean Linux build
        shell: bash
        run: |
          set -euo pipefail
          GOTOOLCHAIN=local GOPROXY=off \
            cmake --build build-helper-a --parallel 2
          ctest --test-dir build-helper-a --output-on-failure --parallel 2
          build-helper-a/bin/yume --version
          build-helper-a/bin/yumed --version
          build-helper-a/bin/yume-chrome-tls-helper --version

      - name: Configure and build helper a second time
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-helper-b -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DYUME_USE_BASEFWX=ON \
            -DYUME_BUILD_CHROME_TLS_HELPER=ON \
            -DYUME_GO_EXECUTABLE="$(command -v go)" \
            -DYUME_BUILD_GUI=OFF \
            -DYUME_BUILD_TOOLS=OFF \
            -DYUME_BUILD_SHARED_ABI=OFF \
            -DYUME_BUILD_SELFTEST=OFF \
            -DYUME_BUILD_TESTING=OFF \
            -DYUME_STATIC=OFF \
            -DYUME_STATIC_OPENSSL=ON \
            -DYUME_NATIVE_OPT=OFF \
            -DYUME_FAST_MATH=OFF \
            -DYUME_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_SKIP_BUILD_RPATH=ON \
            -DBASEFWX_REQUIRE_ARGON2=ON \
            -DBASEFWX_REQUIRE_OQS=ON \
            -DBASEFWX_OQS_STATIC=ON \
            -DOQS_INCLUDE_DIR="${YUME_LIBOQS_PREFIX}/include" \
            -DOQS_LIBRARY="${YUME_LIBOQS_PREFIX}/lib/liboqs.a" \
            -DOQS_LIBRARY_STATIC="${YUME_LIBOQS_PREFIX}/lib/liboqs.a" \
            -DBASEFWX_REQUIRE_LZMA=ON
          GOTOOLCHAIN=local GOPROXY=off \
            cmake --build build-helper-b \
              --target yume_chrome_tls_helper --parallel 2
          test "$(sha256sum build-helper-a/bin/yume-chrome-tls-helper | cut -d' ' -f1)" = \
               "$(sha256sum build-helper-b/bin/yume-chrome-tls-helper | cut -d' ' -f1)"

      - name: Package exact Linux release surface
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -nE 's/.*kVersion\[\] = "([^"]+)".*/\1/p' src/core/version.hpp | head -1)"
          python3 scripts/package_linux_release.py \
            --yume build-helper-a/bin/yume \
            --yumed build-helper-a/bin/yumed \
            --helper build-helper-a/bin/yume-chrome-tls-helper \
            --helper-rebuild build-helper-b/bin/yume-chrome-tls-helper \
            --license LICENSE \
            --notices docs/release/THIRD-PARTY-NOTICES.md \
            --quick-start docs/release/LINUX-2.0-QUICKSTART.md \
            --output-dir dist \
            --version "${VERSION}" \
            --source-commit "$(git rev-parse HEAD)"
          python3 scripts/release_preflight.py \
            --profile "${{ inputs.release_profile }}" \
            --tag "${{ inputs.tag_name }}" \
            --skip-ref-fetch \
            --cmake-cache build-helper-a/CMakeCache.txt \
            --helper-build-a build-helper-a/bin/yume-chrome-tls-helper \
            --helper-build-b build-helper-b/bin/yume-chrome-tls-helper \
            --artifacts dist
          mkdir -p transfer
          tar --format=posix --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime=@0 -cf transfer/linux-desktop-0.2.0-prepared.tar \
            -C dist yume-amd64-linux.tar.xz yumed-amd64-linux

      - name: Upload prepared Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-desktop-0.2.0
          path: transfer/linux-desktop-0.2.0-prepared.tar
          if-no-files-found: error
          retention-days: 14

  publish-release:
    needs: [preflight, build-linux]
    if: ${{ inputs.publish && inputs.independent_security_review && inputs.rc_gates_approved }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download prepared Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-desktop-0.2.0
          path: transfer

      - name: Restore prepared Linux artifact modes
        shell: bash
        run: |
          set -euo pipefail
          archive=transfer/linux-desktop-0.2.0-prepared.tar
          mapfile -t members < <(tar -tf "${archive}")
          test "${#members[@]}" -eq 2
          test "${members[0]}" = "yume-amd64-linux.tar.xz"
          test "${members[1]}" = "yumed-amd64-linux"
          mkdir -p artifacts
          tar --extract --file "${archive}" --directory artifacts \
            --no-same-owner --same-permissions

      - name: Revalidate exact publish surface
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release_preflight.py \
            --profile "${{ inputs.release_profile }}" \
            --tag "${{ inputs.tag_name }}" \
            --skip-ref-fetch \
            --artifacts artifacts

      - name: Generate checksums and manifest
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum yume-amd64-linux.tar.xz > yume-amd64-linux.tar.xz.sha256
          sha256sum yumed-amd64-linux > yumed-amd64-linux.sha256
          sha256sum yume-amd64-linux.tar.xz yumed-amd64-linux > SHA256SUMS.txt
          cd ..
          python3 scripts/release_manifest.py artifacts "${{ inputs.tag_name }}"

      - name: Import optional release signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GPG_PRIVATE_KEY:-}" ]]; then
            echo "YUME_GPG_AVAILABLE=0" >> "${GITHUB_ENV}"
            exit 0
          fi
          keyfile="$(mktemp)"
          trap 'rm -f "${keyfile}"' EXIT
          printf '%s' "${GPG_PRIVATE_KEY}" > "${keyfile}"
          gpg --batch --import "${keyfile}"
          echo "YUME_GPG_AVAILABLE=1" >> "${GITHUB_ENV}"

      - name: Sign and verify release artifacts
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum -c SHA256SUMS.txt
          if [[ "${YUME_GPG_AVAILABLE:-0}" == "1" ]]; then
            for file in yume-amd64-linux.tar.xz yumed-amd64-linux SHA256SUMS.txt release-manifest.json; do
              gpg --batch --yes --pinentry-mode loopback \
                --passphrase "${GPG_PASSPHRASE:-}" \
                --detach-sign --armor --output "${file}.sig" "${file}"
              gpg --batch --verify "${file}.sig" "${file}"
            done
          fi

      - name: Attach to existing release
        shell: bash
        run: |
          set -euo pipefail
          gh release view "${{ inputs.tag_name }}" \
            --repo "${GITHUB_REPOSITORY}" >/dev/null
          gh release upload "${{ inputs.tag_name }}" artifacts/* \
            --clobber --repo "${GITHUB_REPOSITORY}"
