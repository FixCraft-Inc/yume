name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for the release (for example: v1.0.0)"
        required: true
        type: string
      targets:
        description: "Targets to build (comma-separated)"
        required: false
        default: "linux-x86_64,armv7-linux,armv7-busybox,armv8-linux,armv8-busybox,busybox-x86,windows-x86_64"
        type: string
      openwrt_fast:
        description: "Skip OpenWRT SDK package compilation (faster, may skip openwrt-mips artifact if SDK not pre-staged)"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: yume-release-${{ github.event.inputs.tag_name || github.ref_name || github.run_id }}
  cancel-in-progress: false

env:
  OPENWRT_SDK_VERSION: "24.10.0"
  OPENWRT_SDK_TARGET: "ath79-nand"
  BASEFWX_REPO: "https://github.com/F1xGOD/basefwx.git"
  BASEFWX_REF_FILE: ".basefwx-ref"

jobs:
  preflight:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release source
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "workflow_dispatch releases must be started from main." >&2
            exit 1
          fi

      - name: Validate release inputs
        run: |
          python3 ./scripts/release_preflight.py

  build-linux:
    needs: [preflight]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure BaseFWX sources
        run: |
          BASEFWX_REF="${BASEFWX_REF:-}"
          if [[ -z "${BASEFWX_REF}" && -f "${BASEFWX_REF_FILE}" ]]; then
            BASEFWX_REF="$(tr -d '[:space:]' < "${BASEFWX_REF_FILE}")"
          fi
          if [[ -z "${BASEFWX_REF}" ]]; then
            BASEFWX_REF="main"
          fi
          if [[ -d basefwx ]] && ! git -C basefwx rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            rm -rf basefwx
          fi
          if ! git -C basefwx rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            rm -rf basefwx
            git clone --filter=blob:none --no-checkout "${BASEFWX_REPO}" basefwx
          fi
          git -C basefwx fetch --depth 1 origin "${BASEFWX_REF}"
          git -C basefwx checkout --detach FETCH_HEAD
          test -f basefwx/cpp/CMakeLists.txt
          echo "Using BaseFWX ref: $(git -C basefwx rev-parse HEAD)"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libssl-dev zlib1g-dev liblzma-dev libzstd-dev libargon2-dev \
            libboost-all-dev libspdlog-dev nlohmann-json3-dev \
            mingw-w64 gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
            gcc-i686-linux-gnu g++-i686-linux-gnu \
            zstd curl wget git tar xz-utils \
            qemu-user-static binfmt-support \
            clang lld

      - name: Setup vcpkg
        if: contains(github.event.inputs.targets || 'linux-x86_64,armv7-linux,armv7-busybox,armv8-linux,armv8-busybox,busybox-x86,windows-x86_64', 'windows-x86_64')
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git ~/vcpkg
          ~/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          echo "VCPKG_ROOT=${HOME}/vcpkg" >> "${GITHUB_ENV}"

      - name: Download OpenWRT SDK
        if: contains(github.event.inputs.targets || 'linux-x86_64,armv7-linux,armv7-busybox,armv8-linux,armv8-busybox,busybox-x86,windows-x86_64', 'openwrt')
        run: |
          OPENWRT_SDK_NAME="openwrt-sdk-${OPENWRT_SDK_VERSION}-${OPENWRT_SDK_TARGET}_gcc-13.3.0_musl.Linux-x86_64"
          OPENWRT_SDK_URL="https://downloads.openwrt.org/releases/${OPENWRT_SDK_VERSION}/targets/ath79/nand/${OPENWRT_SDK_NAME}.tar.zst"
          mkdir -p ~/.cache/yume
          cd ~/.cache/yume
          if [[ ! -d "${HOME}/${OPENWRT_SDK_NAME}" ]]; then
            curl -L --fail -o "${OPENWRT_SDK_NAME}.tar.zst" "${OPENWRT_SDK_URL}"
            zstd -d "${OPENWRT_SDK_NAME}.tar.zst" -o "${OPENWRT_SDK_NAME}.tar"
            tar -xf "${OPENWRT_SDK_NAME}.tar" -C "${HOME}"
            rm -f "${OPENWRT_SDK_NAME}.tar" "${OPENWRT_SDK_NAME}.tar.zst"
          fi
          echo "OPENWRT_SDK=${HOME}/${OPENWRT_SDK_NAME}" >> "${GITHUB_ENV}"

      - name: Extract prebuilt vendor libs
        run: |
          if [[ -f yume-vendor-prebuilt.tar.xz ]]; then
            tar -xJf yume-vendor-prebuilt.tar.xz
          fi

      - name: Build (Linux + cross)
        run: |
          export YUME_TARGETS="${{ github.event.inputs.targets || 'linux-x86_64,armv7-linux,armv7-busybox,armv8-linux,armv8-busybox,busybox-x86,windows-x86_64' }}"
          export YUME_REQUIRE_ARGON2=1
          export YUME_REQUIRE_OQS=1
          if [[ ",${YUME_TARGETS}," == *",windows-x86_64,"* ]]; then
            export YUME_WINDOWS_CROSS=1
            export YUME_WINDOWS_VCPKG_BUILD_TYPE=release
            export YUME_WINDOWS_VCPKG_PACKAGES="openssl boost-cmake boost-headers boost-system boost-asio zlib zstd liblzma nlohmann-json argon2 liboqs"
          else
            export YUME_WINDOWS_CROSS=0
          fi
          export YUME_MACOS_CROSS=0
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            export YUME_OPENWRT_FAST="${{ github.event.inputs.openwrt_fast || 'true' }}"
          else
            export YUME_OPENWRT_FAST=1
          fi
          echo "Building targets: ${YUME_TARGETS}"
          echo "OpenWRT fast mode: ${YUME_OPENWRT_FAST}"
          sudo -E env \
            PATH="${PATH}" \
            VCPKG_ROOT="${VCPKG_ROOT}" \
            OPENWRT_SDK="${OPENWRT_SDK}" \
            YUME_TARGETS="${YUME_TARGETS}" \
            YUME_REQUIRE_ARGON2="${YUME_REQUIRE_ARGON2}" \
            YUME_REQUIRE_OQS="${YUME_REQUIRE_OQS}" \
            YUME_WINDOWS_CROSS="${YUME_WINDOWS_CROSS}" \
            YUME_WINDOWS_VCPKG_BUILD_TYPE="${YUME_WINDOWS_VCPKG_BUILD_TYPE:-}" \
            YUME_WINDOWS_VCPKG_PACKAGES="${YUME_WINDOWS_VCPKG_PACKAGES:-}" \
            YUME_MACOS_CROSS="${YUME_MACOS_CROSS}" \
            YUME_OPENWRT_FAST="${YUME_OPENWRT_FAST}" \
            ./fullau.sh

      - name: Inspect built artifacts
        run: |
          set -euo pipefail

          inspect_elf() {
            local path="$1"
            [[ -f "$path" ]] || return 0
            echo "Inspecting $path"
            file "$path"
            readelf -h "$path" >/dev/null
            if file "$path" | grep -qi 'dynamically linked'; then
              ldd "$path"
            fi
          }

          inspect_pe() {
            local path="$1"
            [[ -f "$path" ]] || return 0
            echo "Inspecting $path"
            file "$path"
            x86_64-w64-mingw32-objdump -p "$path" | grep 'DLL Name' || true
          }

          inspect_elf "${HOME}/bins/dynamic/x86/linux/yume"
          inspect_elf "${HOME}/bins/dynamic/x86/linux/yumed"
          inspect_elf "${HOME}/bins/stable/x86/linux/yume"
          inspect_elf "${HOME}/bins/stable/x86/linux/yumed"
          inspect_elf "${HOME}/bins/dynamic/armv7/linux/yume"
          inspect_elf "${HOME}/bins/dynamic/armv7/linux/yumed"
          inspect_elf "${HOME}/bins/dynamic/armv8/linux/yume"
          inspect_elf "${HOME}/bins/dynamic/armv8/linux/yumed"
          inspect_elf "${HOME}/bins/dynamic/x86/busybox/yume"
          inspect_elf "${HOME}/bins/dynamic/x86/busybox/yumed"
          inspect_pe "${HOME}/bins/dynamic/windows/x86_64/yume.exe"
          inspect_pe "${HOME}/bins/dynamic/windows/x86_64/yumed.exe"

      - name: Package artifacts
        run: |
          set -euo pipefail
          mkdir -p dist

          pack_one() {
            local src="$1"
            local name="$2"
            if [[ -f "$src" ]]; then
              cp "$src" "dist/${name}"
              echo "Packaged: ${name}"
            fi
          }

          pack_with_libs() {
            local exe="$1"
            local name="$2"
            if [[ -f "$exe" ]]; then
              local dir
              dir="$(dirname "$exe")"
              local files=("$(basename "$exe")")
              while IFS= read -r -d '' f; do
                files+=("$(basename "$f")")
              done < <(find "$dir" -maxdepth 1 \( -name "*.dll" -o -name "*.so*" \) -print0 2>/dev/null || true)
              tar -cJf "dist/${name}.tar.xz" -C "$dir" "${files[@]}"
              echo "Packaged: ${name}.tar.xz"
            fi
          }

          pack_one "${HOME}/bins/dynamic/x86/linux/yume" "yume-amd64-linux"
          pack_one "${HOME}/bins/dynamic/x86/linux/yumed" "yumed-amd64-linux"
          pack_one "${HOME}/bins/stable/x86/linux/yume" "yume-amd64-linux-static"
          pack_one "${HOME}/bins/stable/x86/linux/yumed" "yumed-amd64-linux-static"

          pack_one "${HOME}/bins/dynamic/mips/openwrt/yume" "yume-mips-openwrt"
          pack_one "${HOME}/bins/dynamic/mips/openwrt/yumed" "yumed-mips-openwrt"

          pack_one "${HOME}/bins/dynamic/armv7/linux/yume" "yume-armv7-linux"
          pack_one "${HOME}/bins/dynamic/armv7/linux/yumed" "yumed-armv7-linux"
          pack_one "${HOME}/bins/dynamic/armv7/busybox/yume" "yume-armv7-busybox"
          pack_one "${HOME}/bins/dynamic/armv7/busybox/yumed" "yumed-armv7-busybox"
          pack_one "${HOME}/bins/stable/armv7/busybox/yume" "yume-armv7-busybox-static"
          pack_one "${HOME}/bins/stable/armv7/busybox/yumed" "yumed-armv7-busybox-static"

          pack_one "${HOME}/bins/dynamic/armv8/linux/yume" "yume-armv8-linux"
          pack_one "${HOME}/bins/dynamic/armv8/linux/yumed" "yumed-armv8-linux"
          pack_one "${HOME}/bins/dynamic/armv8/busybox/yume" "yume-armv8-busybox"
          pack_one "${HOME}/bins/dynamic/armv8/busybox/yumed" "yumed-armv8-busybox"
          pack_one "${HOME}/bins/stable/armv8/busybox/yume" "yume-armv8-busybox-static"
          pack_one "${HOME}/bins/stable/armv8/busybox/yumed" "yumed-armv8-busybox-static"

          pack_one "${HOME}/bins/dynamic/x86/busybox/yume" "yume-x86-busybox"
          pack_one "${HOME}/bins/dynamic/x86/busybox/yumed" "yumed-x86-busybox"
          pack_one "${HOME}/bins/stable/x86/busybox/yume" "yume-x86-busybox-static"
          pack_one "${HOME}/bins/stable/x86/busybox/yumed" "yumed-x86-busybox-static"

          pack_with_libs "${HOME}/bins/dynamic/windows/x86_64/yume.exe" "yume-amd64-windows"
          pack_with_libs "${HOME}/bins/dynamic/windows/x86_64/yumed.exe" "yumed-amd64-windows"

          file_count="$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [[ "${file_count}" -eq 0 ]]; then
            echo "No release artifacts were produced." >&2
            exit 1
          fi
          ls -la dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  build-macos:
    needs: [preflight]
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure BaseFWX sources
        run: |
          BASEFWX_REF="${BASEFWX_REF:-}"
          if [[ -z "${BASEFWX_REF}" && -f "${BASEFWX_REF_FILE}" ]]; then
            BASEFWX_REF="$(tr -d '[:space:]' < "${BASEFWX_REF_FILE}")"
          fi
          if [[ -z "${BASEFWX_REF}" ]]; then
            BASEFWX_REF="main"
          fi
          if [[ -d basefwx ]] && ! git -C basefwx rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            rm -rf basefwx
          fi
          if ! git -C basefwx rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            rm -rf basefwx
            git clone --filter=blob:none --no-checkout "${BASEFWX_REPO}" basefwx
          fi
          git -C basefwx fetch --depth 1 origin "${BASEFWX_REF}"
          git -C basefwx checkout --detach FETCH_HEAD
          test -f basefwx/cpp/CMakeLists.txt
          echo "Using BaseFWX ref: $(git -C basefwx rev-parse HEAD)"

      - name: Install dependencies
        run: |
          brew install cmake ninja boost openssl@3 spdlog nlohmann-json zstd xz argon2 liboqs

      - name: Extract prebuilt vendor libs
        run: |
          if [[ -f yume-vendor-prebuilt.tar.xz ]]; then
            tar -xJf yume-vendor-prebuilt.tar.xz
          fi

      - name: Build (macOS arm64)
        env:
          YUME_TARGETS: macos-arm64
          YUME_REQUIRE_ARGON2: "1"
          YUME_REQUIRE_OQS: "1"
          YUME_CMAKE_ARGS: -DBASEFWX_USE_VENDOR_DEPS=OFF
        run: |
          ./ezbuild.sh

      - name: Inspect built artifacts
        run: |
          set -euo pipefail
          for path in build/bin/yume build/bin/yumed; do
            [[ -f "$path" ]] || continue
            echo "Inspecting $path"
            file "$path"
            otool -L "$path"
          done

      - name: Package artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ -f build/bin/yume ]]; then cp build/bin/yume dist/yume-armv8-mac; fi
          if [[ -f build/bin/yumed ]]; then cp build/bin/yumed dist/yumed-armv8-mac; fi
          file_count="$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [[ "${file_count}" -eq 0 ]]; then
            echo "No macOS release artifacts were produced." >&2
            exit 1
          fi
          ls -la dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-builds
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish-release:
    needs: [preflight, build-linux, build-macos]
    runs-on: ubuntu-latest
    # Publish whenever Linux built. macOS is optional: a transient brew or
    # liboqs failure on macos-14 should not block a Linux-only release.
    if: |
      always()
      && (github.event_name == 'release' || github.event_name == 'workflow_dispatch')
      && needs.preflight.result == 'success'
      && needs.build-linux.result == 'success'
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate release manifest
        run: |
          set -euo pipefail
          python3 ./scripts/release_manifest.py artifacts "${{ github.event.inputs.tag_name || github.ref_name }}"
          cat artifacts/release-manifest.json

      - name: Resolve release tag
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          if [[ -z "${TAG}" ]]; then
            echo "Release tag is empty." >&2
            exit 1
          fi
          echo "RELEASE_TAG=${TAG}" >> "${GITHUB_ENV}"

      - name: Ensure release already exists
        run: |
          set -euo pipefail
          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null

      - name: Attach artifacts to existing release
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" artifacts/* --clobber --repo "${GITHUB_REPOSITORY}"
