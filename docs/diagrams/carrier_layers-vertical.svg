<svg class="dgm dgm-vertical" data-dgm="carrier_layers-vertical" width="387" height="446" viewBox="0 0 387 446" role="img" aria-labelledby="dgm-carrier_layers-vertical-title dgm-carrier_layers-vertical-desc" style="--dgm-dur:7.7s" xmlns="http://www.w3.org/2000/svg">
<title id="dgm-carrier_layers-vertical-title">What a transport-v2 tunnel byte is wrapped in</title>
<desc id="dgm-carrier_layers-vertical-desc">From the inside out, the app&#x27;s bytes are sealed, framed for their stream, and carried as a WebSocket message on an HTTP/2 stream inside TLS 1.3 over TCP. The network sees only the outer layers, and timing, sizes and volume stay observable.</desc>
<style>
.dgm {
  --dgm-plate: var(--color-paper, #fff9fd);
  --dgm-card: var(--color-cloud, #fffcfe);
  --dgm-ink: var(--color-ink, #392c35);
  --dgm-muted: var(--color-muted, #6c5a67);
  --dgm-rule: var(--color-rule, #e3d2dd);
  --dgm-accent: var(--color-accent, #e899d3);
  --dgm-strong: var(--color-accent-strong, #9c4088);
  --dgm-soft: var(--color-accent-soft, #fad4ef);
  --dgm-client: var(--color-role-client, #e899d3);
  --dgm-client-strong: var(--color-role-client-strong, #9c4088);
  --dgm-client-soft: var(--color-role-client-soft, #fad4ef);
  --dgm-server: var(--color-role-server, #b5a4ea);
  --dgm-server-strong: var(--color-role-server-strong, #674ea1);
  --dgm-server-soft: var(--color-role-server-soft, #ebe5ff);
  --dgm-data: var(--color-role-data, #7cb8ea);
  --dgm-data-strong: var(--color-role-data-strong, #1b659a);
  --dgm-data-soft: var(--color-role-data-soft, #dbeefe);
  --dgm-disguise: var(--color-role-disguise, #f1ad71);
  --dgm-disguise-strong: var(--color-role-disguise-strong, #985521);
  --dgm-disguise-soft: var(--color-role-disguise-soft, #ffe8d2);
  --dgm-keys: var(--color-role-keys, #f0ce65);
  --dgm-keys-strong: var(--color-role-keys-strong, #7d5e07);
  --dgm-keys-soft: var(--color-role-keys-soft, #fcf2cd);
  --dgm-outside: var(--color-role-outside, #82c9aa);
  --dgm-outside-strong: var(--color-role-outside-strong, #25694f);
  --dgm-outside-soft: var(--color-role-outside-soft, #dbf4e8);
  --dgm-refused: var(--color-role-refused, #ec928b);
  --dgm-refused-strong: var(--color-role-refused-strong, #a73e3b);
  --dgm-refused-soft: var(--color-role-refused-soft, #ffe3df);
  --dgm-neutral: var(--color-role-neutral, #e3d2dd);
  --dgm-neutral-strong: var(--color-role-neutral-strong, #6c5a67);
  --dgm-neutral-soft: var(--color-role-neutral-soft, #f4e7f0);
}

/* Only the fallbacks change. Where the tokens exist this block resolves to
   the same values as the one above, so an explicit theme still decides. */
@media (prefers-color-scheme: dark) {
  .dgm {
    --dgm-plate: var(--color-paper, #10080e);
    --dgm-card: var(--color-cloud, #21171e);
    --dgm-ink: var(--color-ink, #f0e4ec);
    --dgm-muted: var(--color-muted, #958891);
    --dgm-rule: var(--color-rule, #40343c);
    --dgm-accent: var(--color-accent, #e596d0);
    --dgm-strong: var(--color-accent-strong, #ffb2ee);
    --dgm-soft: var(--color-accent-soft, #3e1935);
    --dgm-client: var(--color-role-client, #e596d0);
    --dgm-client-strong: var(--color-role-client-strong, #ffb2ee);
    --dgm-client-soft: var(--color-role-client-soft, #3e1935);
    --dgm-server: var(--color-role-server, #a392d6);
    --dgm-server-strong: var(--color-role-server-strong, #d1c4fd);
    --dgm-server-soft: var(--color-role-server-soft, #2b243f);
    --dgm-data: var(--color-role-data, #6da4d3);
    --dgm-data-strong: var(--color-role-data-strong, #a8d3f9);
    --dgm-data-soft: var(--color-role-data-soft, #12283b);
    --dgm-disguise: var(--color-role-disguise, #dd9b5f);
    --dgm-disguise-strong: var(--color-role-disguise-strong, #f8c696);
    --dgm-disguise-soft: var(--color-role-disguise-soft, #3c220f);
    --dgm-keys: var(--color-role-keys, #e0c262);
    --dgm-keys-strong: var(--color-role-keys-strong, #f3de90);
    --dgm-keys-soft: var(--color-role-keys-soft, #352a09);
    --dgm-outside: var(--color-role-outside, #73b598);
    --dgm-outside-strong: var(--color-role-outside-strong, #aadfc6);
    --dgm-outside-soft: var(--color-role-outside-soft, #112d21);
    --dgm-refused: var(--color-role-refused, #da827b);
    --dgm-refused-strong: var(--color-role-refused-strong, #febab4);
    --dgm-refused-soft: var(--color-role-refused-soft, #401d1b);
    --dgm-neutral: var(--color-role-neutral, #40343c);
    --dgm-neutral-strong: var(--color-role-neutral-strong, #958891);
    --dgm-neutral-soft: var(--color-role-neutral-soft, #2a2127);
  }
}

.dgm-plate {
  fill: var(--dgm-plate);
  stroke: var(--dgm-rule);
  stroke-width: 1;
  opacity: var(--dgm-plate-opacity, 1);
}

/* The shadow is its own shape behind the card, never a filter on the card
   itself. A renderer that cannot resolve the filter drops only the shadow;
   SVG says a reference to a missing filter hides the element that names it,
   which would take the card with it. */
/* The halo under a card and the chip behind its glyph are the presence
   channel: they say the packet is in this node right now. The card's border
   is left alone, because that already says whether the node is YUME software
   and one mark cannot carry two meanings. */
/* The glow and the chip light up with different tokens because they are
   doing different things. A glow is read as colour, not as brightness: on a
   near-white page nothing can be brighter than the page, so it uses accent,
   which stays a mid pink in both themes. Accent-strong there would be a dark
   bloom, which reads as weight rather than attention. */
.dgm-lift {
  fill: var(--dgm-rest);
  opacity: 0.85;
  --dgm-rest: var(--dgm-rule);
  --dgm-live: var(--dgm-tone, var(--dgm-accent));
}

.dgm-card {
  fill: var(--dgm-card);
  stroke: var(--dgm-rule);
  stroke-width: 1.5;
}

/* A card YUME itself runs is outlined in its role colour, and everything the
   route only reaches keeps a neutral outline, so the eye follows the part of
   the path this project is responsible for. It is a software boundary, not a
   trust claim: yumed still terminates the tunnel and sees what it forwards. */
.dgm-node-owned .dgm-card {
  stroke: var(--dgm-tone, var(--dgm-accent));
  stroke-width: 2;
}

/* The chip carries the role on every card, owned or not. It is a filled shape
   with the glyph knocked out of it, so when lit it takes the role's strong
   tone, which contrasts with the card in both themes. */
.dgm-chip {
  fill: var(--dgm-rest);
  --dgm-rest: var(--dgm-tone-soft, var(--dgm-rule));
  --dgm-live: var(--dgm-tone-strong, var(--dgm-strong));
}

/* The glyph goes with its chip. Leaving it on the accent while the chip fills
   with the accent puts light on light, and the icon smears instead of
   reading, so it is knocked out to the card it sits on. */
.dgm-glyph {
  --dgm-rest: none;
  --dgm-live: none;
  --dgm-rest-line: var(--dgm-tone-strong, var(--dgm-muted));
  --dgm-live-line: var(--dgm-card);
}

.dgm-glyph-fill {
  --dgm-rest: var(--dgm-tone-strong, var(--dgm-muted));
  --dgm-live: var(--dgm-card);
  --dgm-rest-line: none;
  --dgm-live-line: none;
}

.dgm-ring,
.dgm-lift,
.dgm-chip,
.dgm-glyph,
.dgm-glyph-fill {
  animation-duration: var(--dgm-dur, 6s);
  animation-timing-function: linear;
  animation-iteration-count: infinite;
}

.dgm-lift,
.dgm-chip {
  --dgm-rest-line: none;
  --dgm-live-line: none;
}

.dgm-glyph {
  fill: none;
  stroke: var(--dgm-tone-strong, var(--dgm-muted));
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.dgm-glyph-fill {
  fill: var(--dgm-tone-strong, var(--dgm-muted));
  stroke: none;
}

.dgm-title {
  fill: var(--dgm-ink);
  font-family: var(--font-display, 'Quicksand', 'Arial Rounded MT Bold', ui-rounded, sans-serif);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.02em;
}

.dgm-sub,
.dgm-edge-label {
  fill: var(--dgm-muted);
  font-family: var(--font-mono, 'IBM Plex Mono', ui-monospace, monospace);
  font-size: 11px;
}

.dgm-centred {
  text-anchor: middle;
}

/* An enclosure holds a run of nodes the specification says belong together,
   and carries the name it gives them. */
.dgm-group {
  fill: var(--dgm-rule);
  fill-opacity: 0.22;
  stroke: var(--dgm-muted);
  stroke-opacity: 0.5;
  stroke-width: 1.5;
  stroke-dasharray: 1 5;
  stroke-linecap: round;
}

.dgm-group-title {
  fill: var(--dgm-muted);
  font-family: var(--font-mono, 'IBM Plex Mono', ui-monospace, monospace);
  font-size: 11px;
  letter-spacing: 0.08em;
}

/* An ordinary hop is quiet plumbing. Colour is kept for the protected hop,
   which carries the brand accent, and for a branch, which takes the role of
   the node it turns towards. */
.dgm-link {
  fill: none;
  stroke: var(--dgm-muted);
  stroke-opacity: 0.55;
  stroke-width: 2.5;
  stroke-linecap: round;
}

.dgm-link-onion {
  stroke-dasharray: 2 5;
}

.dgm-link-branch {
  stroke: var(--dgm-tone);
  stroke-opacity: 1;
  stroke-dasharray: 6 6;
}

/* The protected hop is drawn as a conduit: a soft bore, two walls, and the
   carrier moving between them. Each is one stroked line, so the treatment
   holds at whatever angle the hop runs. This is the ==YUME==> of the ASCII. */
.dgm-conduit {
  fill: none;
  stroke: var(--dgm-soft);
  stroke-width: 20;
  stroke-linecap: round;
}

.dgm-conduit-wall {
  fill: none;
  stroke: var(--dgm-accent);
  stroke-width: 2;
  stroke-linecap: round;
}

.dgm-conduit-flow {
  fill: none;
  stroke: var(--dgm-strong);
  stroke-width: 4;
  stroke-linecap: round;
  stroke-dasharray: 12 26;
  animation: dgm-flow 2.4s linear infinite;
}

/* The stroke rounds the triangle's corners, which is the same softening the
   cards and the chips carry. */
.dgm-arrow {
  fill: var(--dgm-muted);
  stroke: var(--dgm-muted);
  stroke-width: 2;
  stroke-linejoin: round;
}

/* The head of the protected hop keeps the accent its conduit carries. */
.dgm-conduit-head {
  fill: var(--dgm-strong);
  stroke: var(--dgm-strong);
}

.dgm-junction {
  fill: var(--dgm-muted);
}

.dgm-branch .dgm-arrow {
  fill: var(--dgm-tone-strong);
  stroke: var(--dgm-tone-strong);
}

.dgm-role-client {
  --dgm-tone: var(--dgm-client);
  --dgm-tone-strong: var(--dgm-client-strong);
  --dgm-tone-soft: var(--dgm-client-soft);
}

.dgm-role-server {
  --dgm-tone: var(--dgm-server);
  --dgm-tone-strong: var(--dgm-server-strong);
  --dgm-tone-soft: var(--dgm-server-soft);
}

.dgm-role-data {
  --dgm-tone: var(--dgm-data);
  --dgm-tone-strong: var(--dgm-data-strong);
  --dgm-tone-soft: var(--dgm-data-soft);
}

.dgm-role-disguise {
  --dgm-tone: var(--dgm-disguise);
  --dgm-tone-strong: var(--dgm-disguise-strong);
  --dgm-tone-soft: var(--dgm-disguise-soft);
}

.dgm-role-keys {
  --dgm-tone: var(--dgm-keys);
  --dgm-tone-strong: var(--dgm-keys-strong);
  --dgm-tone-soft: var(--dgm-keys-soft);
}

.dgm-role-outside {
  --dgm-tone: var(--dgm-outside);
  --dgm-tone-strong: var(--dgm-outside-strong);
  --dgm-tone-soft: var(--dgm-outside-soft);
}

.dgm-role-refused {
  --dgm-tone: var(--dgm-refused);
  --dgm-tone-strong: var(--dgm-refused-strong);
  --dgm-tone-soft: var(--dgm-refused-soft);
}

.dgm-role-neutral {
  --dgm-tone: var(--dgm-neutral);
  --dgm-tone-strong: var(--dgm-neutral-strong);
  --dgm-tone-soft: var(--dgm-neutral-soft);
}

/* A layer is a ring, filled with its role's tint and outlined in its tone.
   On the loop the rings light in wrapping order, innermost first, which is
   the only thing the motion in a layers figure says. */
.dgm-ring {
  fill: var(--dgm-rest);
  stroke: var(--dgm-rest-line);
  stroke-width: 1.5;
  --dgm-rest: var(--dgm-tone-soft);
  --dgm-live: var(--dgm-tone);
  --dgm-rest-line: var(--dgm-tone);
  --dgm-live-line: var(--dgm-tone-strong);
}

.dgm-ring-title {
  fill: var(--dgm-tone-strong);
  font-family: var(--font-display, 'Quicksand', 'Arial Rounded MT Bold', ui-rounded, sans-serif);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.02em;
}

.dgm-leader {
  fill: none;
  stroke: var(--dgm-rule);
  stroke-width: 1.5;
  stroke-dasharray: 1 4;
  stroke-linecap: round;
}

.dgm-packet-core {
  fill: var(--dgm-strong);
}

.dgm-packet-glow {
  fill: var(--dgm-accent);
  opacity: 0.38;
}

@keyframes dgm-travel {
  from { offset-distance: 0%; }
  to { offset-distance: 100%; }
}

@keyframes dgm-flow {
  to { stroke-dashoffset: -38; }
}

/* The packets are hidden by the markup and revealed only where the property
   that positions them exists. */
@supports (offset-path: path("M0 0")) {
  .dgm-packet {
    display: block;
    offset-path: var(--dgm-path);
    offset-rotate: 0deg;
    offset-distance: 0%;
    animation: dgm-travel var(--dgm-dur, 6s) linear infinite;
  }

  @keyframes dgm-carrier_layers-vertical-here-0 {
    0%, 3.66% { fill: var(--dgm-rest); stroke: var(--dgm-rest-line); }
    6%, 16% { fill: var(--dgm-live); stroke: var(--dgm-live-line); }
    18.34%, 100% { fill: var(--dgm-rest); stroke: var(--dgm-rest-line); }
  }

  [data-dgm="carrier_layers-vertical"] .dgm-here-0 { animation-name: dgm-carrier_layers-vertical-here-0; }

  @keyframes dgm-carrier_layers-vertical-here-1 {
    0%, 13.66% { fill: var(--dgm-rest); stroke: var(--dgm-rest-line); }
    16%, 26% { fill: var(--dgm-live); stroke: var(--dgm-live-line); }
    28.34%, 100% { fill: var(--dgm-rest); stroke: var(--dgm-rest-line); }
  }

  [data-dgm="carrier_layers-vertical"] .dgm-here-1 { animation-name: dgm-carrier_layers-vertical-here-1; }

  @keyframes dgm-carrier_layers-vertical-here-2 {
    0%, 23.66% { fill: var(--dgm-rest); stroke: var(--dgm-rest-line); }
    26%, 36% { fill: var(--dgm-live); stroke: var(--dgm-live-line); }
    38.34%, 100% { fill: var(--dgm-rest); stroke: var(--dgm-rest-line); }
  }

  [data-dgm="carrier_layers-vertical"] .dgm-here-2 { animation-name: dgm-carrier_layers-vertical-here-2; }

  @keyframes dgm-carrier_layers-vertical-here-3 {
    0%, 33.66% { fill: var(--dgm-rest); stroke: var(--dgm-rest-line); }
    36%, 46% { fill: var(--dgm-live); stroke: var(--dgm-live-line); }
    48.34%, 100% { fill: var(--dgm-rest); stroke: var(--dgm-rest-line); }
  }

  [data-dgm="carrier_layers-vertical"] .dgm-here-3 { animation-name: dgm-carrier_layers-vertical-here-3; }

  @keyframes dgm-carrier_layers-vertical-here-4 {
    0%, 43.66% { fill: var(--dgm-rest); stroke: var(--dgm-rest-line); }
    46%, 56% { fill: var(--dgm-live); stroke: var(--dgm-live-line); }
    58.34%, 100% { fill: var(--dgm-rest); stroke: var(--dgm-rest-line); }
  }

  [data-dgm="carrier_layers-vertical"] .dgm-here-4 { animation-name: dgm-carrier_layers-vertical-here-4; }

  @keyframes dgm-carrier_layers-vertical-here-5 {
    0%, 53.66% { fill: var(--dgm-rest); stroke: var(--dgm-rest-line); }
    56%, 66% { fill: var(--dgm-live); stroke: var(--dgm-live-line); }
    68.34%, 100% { fill: var(--dgm-rest); stroke: var(--dgm-rest-line); }
  }

  [data-dgm="carrier_layers-vertical"] .dgm-here-5 { animation-name: dgm-carrier_layers-vertical-here-5; }

  @keyframes dgm-carrier_layers-vertical-here-6 {
    0%, 63.66% { fill: var(--dgm-rest); stroke: var(--dgm-rest-line); }
    66%, 76% { fill: var(--dgm-live); stroke: var(--dgm-live-line); }
    78.34%, 100% { fill: var(--dgm-rest); stroke: var(--dgm-rest-line); }
  }

  [data-dgm="carrier_layers-vertical"] .dgm-here-6 { animation-name: dgm-carrier_layers-vertical-here-6; }
}

@media (prefers-reduced-motion: reduce) {
  .dgm-packet {
    display: none;
  }

  .dgm-conduit-flow,
  .dgm-ring,
  .dgm-lift,
  .dgm-chip,
  .dgm-glyph,
  .dgm-glyph-fill {
    animation: none;
  }
}
</style>
