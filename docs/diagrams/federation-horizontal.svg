<svg class="dgm dgm-horizontal" data-dgm="federation-horizontal" width="1211" height="210" viewBox="0 0 1211 210" role="img" aria-labelledby="dgm-federation-horizontal-title dgm-federation-horizontal-desc" style="--dgm-dur:7.21s" xmlns="http://www.w3.org/2000/svg">
<title id="dgm-federation-horizontal-title">Federation peer link</title>
<desc id="dgm-federation-horizontal-desc">One direct peer link joins two local relay endpoints. There is no third-node transit and no federated exit path.</desc>
<style>
.dgm {
  --dgm-plate: var(--color-paper, #fff9fd);
  --dgm-card: var(--color-cloud, #fffcfe);
  --dgm-ink: var(--color-ink, #392c35);
  --dgm-muted: var(--color-muted, #6c5a67);
  --dgm-rule: var(--color-rule, #e3d2dd);
  --dgm-accent: var(--color-accent, #e899d3);
  --dgm-strong: var(--color-accent-strong, #9c4088);
  --dgm-soft: var(--color-accent-soft, #fad4ef);
}

/* Only the fallbacks change. Where the tokens exist this block resolves to
   the same values as the one above, so an explicit theme still decides. */
@media (prefers-color-scheme: dark) {
  .dgm {
    --dgm-plate: var(--color-paper, #10080e);
    --dgm-card: var(--color-cloud, #21171e);
    --dgm-ink: var(--color-ink, #f0e4ec);
    --dgm-muted: var(--color-muted, #958891);
    --dgm-rule: var(--color-rule, #40343c);
    --dgm-accent: var(--color-accent, #e596d0);
    --dgm-strong: var(--color-accent-strong, #ffb2ee);
    --dgm-soft: var(--color-accent-soft, #3e1935);
  }
}

.dgm-plate {
  fill: var(--dgm-plate);
  stroke: var(--dgm-rule);
  stroke-width: 1;
  opacity: var(--dgm-plate-opacity, 1);
}

/* The shadow is its own shape behind the card, never a filter on the card
   itself. A renderer that cannot resolve the filter drops only the shadow;
   SVG says a reference to a missing filter hides the element that names it,
   which would take the card with it. */
/* The halo under a card and the chip behind its glyph are the presence
   channel: they say the packet is in this node right now. The card's border
   is left alone, because that already says whether the node is YUME software
   and one mark cannot carry two meanings. */
/* The glow and the chip light up with different tokens because they are
   doing different things. A glow is read as colour, not as brightness: on a
   near-white page nothing can be brighter than the page, so it uses accent,
   which stays a mid pink in both themes. Accent-strong there would be a dark
   bloom, which reads as weight rather than attention. */
.dgm-lift {
  fill: var(--dgm-rest);
  opacity: 0.85;
  --dgm-rest: var(--dgm-rule);
  --dgm-live: var(--dgm-accent);
}

.dgm-card {
  fill: var(--dgm-card);
  stroke: var(--dgm-rule);
  stroke-width: 1.5;
}

/* A card YUME itself runs carries the accent, and everything the route only
   reaches stays neutral, so the eye follows the part of the path this
   project is responsible for. It is a software boundary, not a trust claim:
   yumed still terminates the tunnel and sees the traffic it forwards. */
.dgm-node-owned .dgm-card {
  stroke: var(--dgm-accent);
  stroke-width: 2;
}

/* The chip is a filled shape with the glyph knocked out of it, so it needs
   contrast against the card in both themes, which is what accent-strong is
   for: dark on light paper, bright on dark paper. */
.dgm-chip {
  fill: var(--dgm-rest);
  --dgm-rest: var(--dgm-rule);
  --dgm-live: var(--dgm-strong);
}

.dgm-node-owned .dgm-chip {
  --dgm-rest: var(--dgm-soft);
}

/* The glyph goes with its chip. Leaving it on the accent while the chip fills
   with the accent puts light on light, and the icon smears instead of
   reading, so it is knocked out to the card it sits on. */
.dgm-glyph {
  --dgm-rest: none;
  --dgm-live: none;
  --dgm-rest-line: var(--dgm-muted);
  --dgm-live-line: var(--dgm-card);
}

.dgm-node-owned .dgm-glyph {
  --dgm-rest-line: var(--dgm-strong);
}

.dgm-glyph-fill {
  --dgm-rest: var(--dgm-muted);
  --dgm-live: var(--dgm-card);
  --dgm-rest-line: none;
  --dgm-live-line: none;
}

.dgm-node-owned .dgm-glyph-fill {
  --dgm-rest: var(--dgm-strong);
}

.dgm-lift,
.dgm-chip,
.dgm-glyph,
.dgm-glyph-fill {
  animation-duration: var(--dgm-dur, 6s);
  animation-timing-function: linear;
  animation-iteration-count: infinite;
}

.dgm-lift,
.dgm-chip {
  --dgm-rest-line: none;
  --dgm-live-line: none;
}

.dgm-glyph {
  fill: none;
  stroke: var(--dgm-muted);
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.dgm-glyph-fill {
  fill: var(--dgm-muted);
  stroke: none;
}

.dgm-node-owned .dgm-glyph {
  stroke: var(--dgm-strong);
}

.dgm-node-owned .dgm-glyph-fill {
  fill: var(--dgm-strong);
}

.dgm-title {
  fill: var(--dgm-ink);
  font-family: var(--font-display, 'Quicksand', 'Arial Rounded MT Bold', ui-rounded, sans-serif);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.02em;
}

.dgm-sub,
.dgm-edge-label {
  fill: var(--dgm-muted);
  font-family: var(--font-mono, 'IBM Plex Mono', ui-monospace, monospace);
  font-size: 11px;
}

.dgm-centred {
  text-anchor: middle;
}

/* An enclosure holds a run of nodes the specification says belong together,
   and carries the name it gives them. */
.dgm-group {
  fill: var(--dgm-soft);
  fill-opacity: 0.55;
  stroke: var(--dgm-accent);
  stroke-width: 1.5;
  stroke-dasharray: 1 5;
  stroke-linecap: round;
}

.dgm-group-title {
  fill: var(--dgm-strong);
  font-family: var(--font-mono, 'IBM Plex Mono', ui-monospace, monospace);
  font-size: 11px;
  letter-spacing: 0.08em;
}

.dgm-link {
  fill: none;
  stroke: var(--dgm-accent);
  stroke-width: 2.5;
  stroke-linecap: round;
}

.dgm-link-onion {
  stroke-dasharray: 2 5;
}

/* The protected hop is drawn as a conduit: a soft bore, two walls, and the
   carrier moving between them. Each is one stroked line, so the treatment
   holds at whatever angle the hop runs. This is the ==YUME==> of the ASCII. */
.dgm-conduit {
  fill: none;
  stroke: var(--dgm-soft);
  stroke-width: 20;
  stroke-linecap: round;
}

.dgm-conduit-wall {
  fill: none;
  stroke: var(--dgm-accent);
  stroke-width: 2;
  stroke-linecap: round;
}

.dgm-conduit-flow {
  fill: none;
  stroke: var(--dgm-strong);
  stroke-width: 4;
  stroke-linecap: round;
  stroke-dasharray: 12 26;
  animation: dgm-flow 2.4s linear infinite;
}

/* The stroke rounds the triangle's corners, which is the same softening the
   cards and the chips carry. */
.dgm-arrow {
  fill: var(--dgm-strong);
  stroke: var(--dgm-strong);
  stroke-width: 2;
  stroke-linejoin: round;
}

.dgm-packet-core {
  fill: var(--dgm-strong);
}

.dgm-packet-glow {
  fill: var(--dgm-accent);
  opacity: 0.38;
}

@keyframes dgm-travel {
  from { offset-distance: 0%; }
  to { offset-distance: 100%; }
}

@keyframes dgm-flow {
  to { stroke-dashoffset: -38; }
}

/* The packets are hidden by the markup and revealed only where the property
   that positions them exists. */
@supports (offset-path: path("M0 0")) {
  .dgm-packet {
    display: block;
    offset-path: var(--dgm-path);
    offset-rotate: 0deg;
    offset-distance: 0%;
    animation: dgm-travel var(--dgm-dur, 6s) linear infinite;
  }

  @keyframes dgm-federation-horizontal-here-0 {
    0%, 8.33% { fill: var(--dgm-live); stroke: var(--dgm-live-line); }
    10.82%, 100% { fill: var(--dgm-rest); stroke: var(--dgm-rest-line); }
  }

  [data-dgm="federation-horizontal"] .dgm-here-0 { animation-name: dgm-federation-horizontal-here-0; }

  @keyframes dgm-federation-horizontal-here-1 {
    0%, 24.83% { fill: var(--dgm-rest); stroke: var(--dgm-rest-line); }
    27.33%, 43.98% { fill: var(--dgm-live); stroke: var(--dgm-live-line); }
    46.48%, 100% { fill: var(--dgm-rest); stroke: var(--dgm-rest-line); }
  }

  [data-dgm="federation-horizontal"] .dgm-here-1 { animation-name: dgm-federation-horizontal-here-1; }

  @keyframes dgm-federation-horizontal-here-2 {
    0%, 56.05% { fill: var(--dgm-rest); stroke: var(--dgm-rest-line); }
    58.55%, 75.2% { fill: var(--dgm-live); stroke: var(--dgm-live-line); }
    77.7%, 100% { fill: var(--dgm-rest); stroke: var(--dgm-rest-line); }
  }

  [data-dgm="federation-horizontal"] .dgm-here-2 { animation-name: dgm-federation-horizontal-here-2; }

  @keyframes dgm-federation-horizontal-here-3 {
    0%, 89.18% { fill: var(--dgm-rest); stroke: var(--dgm-rest-line); }
    91.67%, 100% { fill: var(--dgm-live); stroke: var(--dgm-live-line); }
  }

  [data-dgm="federation-horizontal"] .dgm-here-3 { animation-name: dgm-federation-horizontal-here-3; }
}

@media (prefers-reduced-motion: reduce) {
  .dgm-packet {
    display: none;
  }

  .dgm-conduit-flow,
  .dgm-lift,
  .dgm-chip,
  .dgm-glyph,
  .dgm-glyph-fill {
    animation: none;
  }
}
</style>
