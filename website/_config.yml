# Jekyll builds only the website/ directory (see .github/workflows/pages.yml),
# so nothing outside it needs excluding.
title: YUME
product_version: 0.3.0-dev1
description: >-
  YUME is an open-source internet freedom tool. It carries TCP, UDP and IP
  traffic through a server you control over an encrypted connection shaped
  like a browser visiting a website.
# Bumped whenever assets/tokens.css, site.css or site.js changes, so returning
# visitors are not served a cached stylesheet against new markup. One place,
# read by _includes/head.html.
asset_version: 19

repo_url: https://github.com/FixCraft-Inc/yume

markdown: kramdown
theme: null
kramdown:
  input: GFM
  syntax_highlighter: rouge
exclude:
  - .jekyll-cache
  - README.md
  - DESIGN.md
