# Jekyll builds only the website/ directory (see .github/workflows/pages.yml),
# so nothing outside it needs excluding.
title: YUME
product_version: 0.2.0-dev6
description: >-
  YUME is an open-source hybrid post-quantum transport that carries
  TCP and UDP through a browser-shaped TLS 1.3 + HTTP/2 connection.
# Bumped whenever assets/site.css or assets/site.js changes, so returning
# visitors are not served a cached stylesheet against new markup. One place,
# read by _includes/head.html.
asset_version: 11

repo_url: https://github.com/FixCraft-Inc/yume

markdown: kramdown
theme: null
kramdown:
  input: GFM
  syntax_highlighter: rouge
exclude:
  - .jekyll-cache
  - README.md
