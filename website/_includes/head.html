<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{%- if page.layout == 'doc' %}
<title>{{ page.title | escape }} | YUME</title>
<meta name="description" content="{{ page.description | escape }}">
{%- else %}
<title>{{ page.title | escape }}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_newlines | strip | escape }}">
{%- endif %}
<link rel="icon" type="image/svg+xml" href="{{ '/assets/yume-mark.svg' | relative_url }}?v={{ site.asset_version }}">
{%- comment -%}
Light is the default whatever the system preference, and site.js rewrites
this colour when a visitor chooses the dark theme.
{%- endcomment %}
<meta name="theme-color" content="#fffafd">
<script>
  // Runs before first paint so a stored choice never flashes the other theme,
  // and so CSS can tell before that paint whether scripts run at all.
  document.documentElement.classList.add("js");
  try {
    var t = localStorage.getItem("yume-theme");
    if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<link rel="preload" href="{{ '/assets/fonts/quicksand-latin-wght-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ '/assets/fonts/nunito-sans-latin-wght-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ '/assets/tokens.css' | relative_url }}?v={{ site.asset_version }}">
<link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}?v={{ site.asset_version }}">
<script src="{{ '/assets/site.js' | relative_url }}?v={{ site.asset_version }}" defer></script>
