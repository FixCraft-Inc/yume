<!doctype html>
<html lang="en">
  <head>
    {%- include head.html -%}
  </head>
  <body class="document-page">
    <a class="skip-link" href="#content">Skip to content</a>
    <div class="doc-progress" aria-hidden="true"></div>
    <div class="doc-container">
      <header class="doc-header">
        {% include brand.html class="doc-brand" %}
        <nav class="doc-nav">
          <a href="{{ '/docs/' | relative_url }}">All docs</a>
          <a href="{{ site.repo_url }}" target="_blank" rel="noopener">GitHub</a>
          {% include theme-toggle.html %}
        </nav>
      </header>
      <main class="doc-shell" id="content">
        <details class="doc-toc" open>
          <summary>On this page</summary>
          <nav id="doc-toc-list" aria-label="On this page"></nav>
        </details>
        <article class="doc-article">
          {{ content }}
        </article>
      </main>
      {% include site-footer.html statement="Published from the YUME source tree on main." %}
    </div>
  </body>
</html>
