<!doctype html>
<html lang="en" data-asset-base="{{ '/assets/' | relative_url }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }} | YUME</title>
    <meta name="description" content="{{ page.title }} documentation generated from the YUME repository.">
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/yume-white.svg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
    <script src="{{ '/assets/site.js' | relative_url }}" defer></script>
  </head>
  <body>
    <div class="doc-container">
      <header class="doc-header">
        <a class="doc-brand" href="{{ '/' | relative_url }}">
          <span class="brand-mark" aria-hidden="true">
            <span class="brand-icon" aria-hidden="true"></span>
            <span class="brand-cutout" aria-hidden="true"></span>
          </span>
          <span>
            <span class="brand-name">YUME</span>
            <span class="brand-sub">A FixCraft protected transport</span>
          </span>
        </a>
        <nav class="doc-nav">
          <a href="{{ '/docs/' | relative_url }}">All docs</a>
          <a href="{{ '/docs/QUICKSTART/' | relative_url }}">Quick start</a>
          <a href="{{ '/docs/STEALTH/' | relative_url }}">Stealth</a>
          <a href="{{ '/docs/THREAT_MODEL/' | relative_url }}">Threat model</a>
          <a href="{{ '/docs/PERMISSIONS/' | relative_url }}">Permissions</a>
          <a href="{{ '/docs/OPERATIONS/' | relative_url }}">Operations</a>
          <a href="{{ '/docs/IMPLEMENTATION_STATUS/' | relative_url }}">Status</a>
          <a href="https://github.com/FixCraft-Inc/yume" target="_blank" rel="noopener">GitHub</a>
        </nav>
      </header>
      <main class="doc-shell">
        <details class="doc-toc" open>
          <summary>On this page</summary>
          <nav id="doc-toc-list" aria-label="On this page"></nav>
        </details>
        <article class="doc-article">
          {{ content }}
        </article>
      </main>
      <footer>
        Published from the YUME source tree on <code>main</code> &middot; experimental development software &middot; AGPL-3.0-or-later
      </footer>
    </div>
  </body>
</html>
